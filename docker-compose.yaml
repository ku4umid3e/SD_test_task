services:
  db:
    image: postgres
    container_name: store-db
    hostname: store-db
    restart: always
    environment:
      POSTGRES_USER: user_postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a new PostgreSQL password}
      POSTGRES_DB: db_store
    ports:
      - "127.0.0.1:5432:5432"

